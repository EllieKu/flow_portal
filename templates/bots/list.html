{% extends 'base.html' %}

{% block title %}我的 Bot · Flow Portal{% endblock %}

{% block content %}
<section aria-labelledby="bots-title">
  <h1 id="bots-title">我的 Bot</h1>
  <div class="bot-grid">
    {% for bot in bots %}
      <article class="card bot-card">
        <h2>{{ bot.name }}</h2>
        {% if bot.description %}<p class="bot-description">{{ bot.description }}</p>{% endif %}
        <a class="bot-card-link" href="{{ bot.get_absolute_url }}" target="_blank" rel="noopener" aria-label="在新分頁開啟 {{ bot.name }}"></a>
      </article>
    {% empty %}
      <div class="card"><p>目前沒有可使用的 Bot，請聯絡管理員設定使用權限。</p></div>
    {% endfor %}
  </div>
</section>
{% endblock %}
