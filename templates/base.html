{% load static %}
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Flow Portal{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/portal.css' %}?v=28">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block header %}
  <header class="site-header">
    <a class="brand" href="{% url 'accounts:home' %}">Flow Portal</a>
    {% if user.is_authenticated %}
      <nav aria-label="帳號選單">
        <span>{{ user.username }}</span>
        {% if user.is_staff %}<a href="{% url 'admin:index' %}">管理後台</a>{% endif %}
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button class="secondary" type="submit">登出</button>
        </form>
      </nav>
    {% endif %}
  </header>
  {% endblock %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
